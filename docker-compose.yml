# Chroma 使用本地持久化模式，无需 Docker。
# 以下仅为开发时需要外部服务的场景保留。

services:
  # Chroma 独立服务（可选 — 默认使用本地文件持久化，无需启动）
  chroma:
    image: chromadb/chroma:0.5.20
    container_name: rag-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    profiles:
      - server  # 仅在显式指定 profile 时启动：docker compose --profile server up
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  chroma_data:
