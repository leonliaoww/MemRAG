[project]
name = "rag-enterprise"
version = "0.1.0"
description = "Enterprise-grade RAG knowledge base system"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # --- LangChain ecosystem ---
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    # --- Vector store ---
    "chromadb>=0.5.0",
    "langchain-chroma>=1.0.0",
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "sse-starlette>=2.1.0",
    # --- Data validation ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # --- Document processing ---
    "unstructured[all-docs]>=0.15.0",
    "pypdf>=5.0.0",
    "docx2txt>=0.8",
    # --- Redis / Celery ---
    "redis>=5.1.0",
    "celery[redis]>=5.4.0",
    # --- Hybrid search ---
    "rank-bm25>=0.2.2",
    # --- Reranker ---
    "sentence-transformers>=3.1.0",
    # --- Monitoring ---
    "prometheus-client>=0.20.0",
    "structlog>=24.4.0",
    # --- Auth ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    # --- Utilities ---
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
