[project]
name = "rag-enterprise"
version = "0.1.0"
description = "企业级 RAG 知识库系统"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # --- LangChain 生态 ---
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    # --- 阿里云 DashScope（LLM + Embedding）---
    "dashscope>=1.20.0",
    # --- 向量库（本地持久化）---
    "chromadb>=0.5.0",
    "langchain-chroma>=1.0.0",
    # --- Web 框架 ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "sse-starlette>=2.1.0",
    # --- 数据校验 ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # --- 关系型数据库（可选）---
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # --- 文档处理 ---
    "unstructured[all-docs]>=0.15.0",
    "unstructured_inference>=1.0.0",
    "pymupdf>=1.27.0",
    "docx2txt>=0.8",
    # --- 混合检索（BM25）---
    "rank-bm25>=0.2.2",
    # --- 重排序 ---
    "sentence-transformers>=3.1.0",
    # --- 监控 ---
    "prometheus-client>=0.20.0",
    "structlog>=24.4.0",
    # --- 认证 ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    # --- 工具库 ---
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
